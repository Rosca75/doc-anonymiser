# ci.yml — build + test on every push and pull request.
#
# All compilation happens here on GitHub Actions, never on the developer
# laptop (see CLAUDE.md). This workflow:
#   1. checks out the code,
#   2. installs the pinned Go toolchain (1.26.x),
#   3. installs the pinned Wails CLI (v2.13.0) and FAILS with an actionable
#      message if the CLI version diverges from the Wails library version
#      required in go.mod (they are a coupled pair — see CLAUDE.md §7),
#   4. runs `go vet` and `go test`,
#   5. runs the frontend node tests,
#   6. runs the LINUX RENDERING HARNESS (layer 3, docs/UITESTING.md): a real
#      Chromium over the DevTools Protocol, asserting what a user would SEE.
#      This one BLOCKS: the seven issues reported against the built application
#      all passed the tests above it, and the questions it answers (does the
#      screen fit, is the tooltip visible or clipped) are answerable only by a
#      renderer,
#   7. does a Linux `wails build` as a build-sanity check (the Ubuntu runner
#      needs GTK + WebKit dev headers, installed below).
name: CI

on:
  push:
  pull_request:
  # The Windows UI job is opt-in: it needs the packaged .exe and the real
  # WebView2, so it runs on demand and on tags rather than on every push. The
  # rendering checks themselves gate on ubuntu-latest in the job below.
  workflow_dispatch:

env:
  # The single place the Wails CLI version is pinned for CI.
  # Must match the github.com/wailsapp/wails/v2 version in go.mod.
  WAILS_CLI_VERSION: v2.13.0

# Least privilege for the automatically provided GITHUB_TOKEN. This workflow
# only checks out code and runs build/test steps, so read access to the
# repository contents is all it needs; nothing here writes to the repo, issues,
# or packages. Setting this at the top level applies it to every job.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # Wails on Linux compiles against GTK3 and WebKit2GTK. Ubuntu 24.04
      # runners ship webkit2gtk 4.1, hence the -tags webkit2_41 build flag
      # used further down.
      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      # The Wails CLI and the Wails Go library (go.mod) must be the same
      # version — mixed versions cause confusing build/runtime errors.
      # This step compares them and fails loudly with instructions.
      - name: Verify Wails CLI version matches go.mod
        run: |
          GOMOD_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "go.mod Wails version:    ${GOMOD_VERSION}"
          echo "Pinned CLI version (CI): ${WAILS_CLI_VERSION}"
          if [ "${GOMOD_VERSION}" != "${WAILS_CLI_VERSION}" ]; then
            echo "::error::Wails version mismatch: go.mod requires ${GOMOD_VERSION} but CI pins the CLI at ${WAILS_CLI_VERSION}."
            echo "::error::Fix: update WAILS_CLI_VERSION in .github/workflows/ci.yml AND .github/workflows/release.yml to ${GOMOD_VERSION}, or run 'go get github.com/wailsapp/wails/v2@${WAILS_CLI_VERSION}' so both sides agree. Also update CLAUDE.md §7 if the minor version changes."
            exit 1
          fi

      # Formatting is a guard, not a preference: an unformatted file fails
      # every future diff review before it fails anything else.
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "${UNFORMATTED}"
            echo "::error::Fix: run 'gofmt -w .' and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Layer 2: the frontend unit tests. Plain `node --test`, zero npm
      # dependencies (node ships on the runner; see BUILD.md Phase 6).
      #
      # The pattern is RECURSIVE and it is QUOTED, and both matter. The flat
      # `frontend/*.test.js` this used to be silently ignored anything under
      # frontend/views/, so a test file added next to a view module would never
      # run and CI would stay green: a false pass, which is worse than no test.
      # The quotes hand the pattern to node rather than to bash, whose globstar
      # is off by default and would expand `**` as a single `*`, reintroducing
      # the same hole from the other direction.
      #
      # ../frontend_tests_test.go expands this exact pattern and fails if any
      # test file on disk would be missed by it.
      - name: frontend unit tests (node --test)
        run: node --test "frontend/**/*.test.js"

      # Layer 3 of the test strategy (docs/UITESTING.md), and the first version
      # of it that actually runs anywhere. It serves frontend/ over loopback,
      # drives a headless Chromium over the DevTools Protocol, and asserts the
      # things only a renderer can answer: no wizard screen scrolls or clips the
      # page, the Import preview shows source text rather than placeholders, the
      # Configure rail is three detection routes with the documented default
      # switches, a real hover produces a tooltip that is visibly inside the
      # Compare card, and nothing logged an error.
      #
      # It BLOCKS, deliberately. Every one of the seven reported issues passed
      # the steps above; a check that catches them and does not gate is a
      # comment. It needs no new dependency (a small RFC 6455 client in the
      # harness) and no service, and the whole run is a few seconds.
      #
      # No install step: the GitHub ubuntu runner image already ships Google
      # Chrome, and the harness finds it on PATH. Nothing is downloaded, no npm
      # is involved (Playwright would need it), and CI spends no time on it. If a
      # future runner image drops Chrome, this step is where it will say so
      # rather than the harness failing further down.
      - name: Locate the browser for the rendering harness
        run: |
          BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -z "${BROWSER}" ]; then
            echo "::error::No Chromium-family browser on PATH, so the rendering harness cannot run."
            echo "::error::Fix: add an install step (apt-get install -y chromium), or set CHROME to a browser binary."
            exit 1
          fi
          echo "Using ${BROWSER}"
          "${BROWSER}" --version

      - name: UI rendering harness (Linux, layer 3)
        run: go run ./scripts/uitest/renderharness -keep-artifacts

      - name: Upload rendering-harness artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-rendering-linux
          path: scripts/uitest/artifacts/
          if-no-files-found: ignore

      # Build sanity only — we do not ship the Linux CI binary from here
      # (release.yml handles real artefacts on tags).
      - name: wails build (Linux sanity check)
        run: wails build -platform linux/amd64 -tags webkit2_41

  # ---------------------------------------------------------------------------
  # The ADDITIONAL PLATFORM CHECK (docs/UITESTING.md): Windows, the real
  # WebView2 engine, and the packaged .exe.
  #
  # The rendering assertions themselves already gated on ubuntu-latest above, in
  # Chromium. This job exists for the two things Linux cannot do: run them
  # against the engine the user actually gets, and inspect the accessibility
  # tree of the built binary, which is what catches a white-screen boot. It
  # shares its probes with the Linux harness (scripts/uitest/probes.js), so the
  # assertions are not duplicated, only the plumbing.
  #
  # STILL UNVERIFIED: this script has never been executed on a Windows machine,
  # which is exactly why it is continue-on-error. Promote it to a gate by
  # deleting that line once it has passed a few times.
  ui-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_CLI_VERSION}

      - name: UI checks against wails dev
        run: pwsh scripts/uitest/Invoke-UITest.ps1 -KeepArtifacts

      - name: UI smoke test against the packaged binary
        run: pwsh scripts/uitest/Invoke-UITest.ps1 -Packaged -KeepArtifacts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-rendering-windows
          path: scripts/uitest/artifacts/
          if-no-files-found: ignore
