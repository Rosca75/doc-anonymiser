# ci.yml — the fast, always-on tiers on every push and pull request.
#
# The test suite is organised into three tiers by build tag (docs/TESTING.md).
# This workflow runs the two that gate broadly:
#
#   unit         every push and PR, with -race and a coverage gate. Pure,
#                in-package, deterministic, hermetic. Under 10s.
#   integration  on PRs to main (and pushes to main). Real file I/O, format
#                round-trips, the mock-Ollama detection flow, the python SARIF
#                converter. Because Go build tags are ADDITIVE, this job re-runs
#                the unit tier too; that overlap is kept on purpose as a
#                single-command safety net on the merge gate (docs/TESTING.md).
#
# The deep tier (wall-clock budgets, real Ollama) runs on demand in deep.yml.
# The layer-3 rendering harness runs per-push-on-UI-change in ui.yml. Neither
# is repeated here.
#
# The compile-rot guard below compiles and vets EVERY tier once, because
# build-tagged files are invisible to the compiler and go vet unless the tag is
# set; without it a tagged file could rot unnoticed between the runs that use it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The single place the Wails CLI version is pinned for CI.
  # Must match the github.com/wailsapp/wails/v2 version in go.mod.
  WAILS_CLI_VERSION: v2.13.0

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # UNIT TIER, every push and PR. Plus the compile-rot guard and gofmt, which
  # are cheap and belong on every push.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # Formatting is a guard, not a preference: an unformatted file fails every
      # future diff review before it fails anything else.
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "${UNFORMATTED}"
            echo "::error::Fix: run 'gofmt -w .' and commit the result."
            exit 1
          fi

      # Compile-rot guard (mandatory, docs/TESTING.md). Build-tagged files are
      # invisible to the compiler and go vet unless the tag is set, so this
      # compiles and vets EVERY tier once. One step, not one per tier: this also
      # covers the plain unit build, because tags are additive.
      - name: Compile-rot guard (vet + build, all tiers)
        run: |
          go vet -tags=integration,deep ./...
          go build -tags=integration,deep ./...

      # The unit tier itself: -race every push (race instrumentation costs
      # ~5-10x, so it runs here and not on the integration job), plus coverage,
      # which gates on this tier only.
      - name: Unit tier (go test -race, with coverage)
        run: |
          start=$(date +%s)
          go test -race -coverprofile=cover.out ./...
          end=$(date +%s)
          pct=$(go tool cover -func=cover.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          {
            echo "### Unit tier"
            echo "Wall-clock: $((end - start))s (with -race; build/test cache enabled, no -count=1)."
            echo "Coverage: ${pct}% (gate: >= 45%)."
          } >> "$GITHUB_STEP_SUMMARY"
          awk "BEGIN{ exit !(${pct} >= 45.0) }" || {
            echo "::error::Unit-tier coverage ${pct}% fell below the 45% floor. Add or restore unit tests."
            exit 1
          }

      # Layer 2: the frontend unit tests. Plain `node --test`, zero npm deps
      # (node ships on the runner). The pattern is RECURSIVE and QUOTED; the flat
      # frontend/*.test.js silently skipped everything under frontend/views/, and
      # ../frontend_tests_test.go expands this exact pattern and fails if any test
      # file on disk would be missed by it.
      - name: Frontend unit tests (node --test)
        run: node --test "frontend/**/*.test.js"

  # ---------------------------------------------------------------------------
  # INTEGRATION TIER, on PRs to main and pushes to main. Additive: it re-runs
  # the unit tier as a single-command safety net (the documented, kept overlap).
  # It excludes the deep tier by simply not passing that tag.
  integration:
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # The integration tier: unit + integration. Python is already on the
      # ubuntu image, which the SARIF-converter tests need; a missing
      # interpreter would t.Skip, never fail. No -race here: it would only
      # re-instrument the unit tests this job re-runs, at 5-10x cost and no new
      # information.
      - name: Integration tier (go test -tags=integration)
        run: |
          start=$(date +%s)
          go test -tags=integration ./...
          end=$(date +%s)
          {
            echo "### Integration tier"
            echo "Wall-clock: $((end - start))s (build/test cache enabled, no -count=1)."
            echo "Ran unit + integration; the deep tier is excluded on purpose."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # BUILD SANITY: a Linux `wails build` so a broken build is caught here rather
  # than at release. Also the coupled-version check between the Wails CLI and
  # go.mod, which belongs beside the build that depends on it.
  build-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      # Wails on Linux compiles against GTK3 and WebKit2GTK. Ubuntu 24.04
      # runners ship webkit2gtk 4.1, hence the -tags webkit2_41 build flag below.
      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      # The Wails CLI and the Wails Go library (go.mod) must be the same version
      # (they are a coupled pair). This fails loudly with instructions if they
      # diverge.
      - name: Verify Wails CLI version matches go.mod
        run: |
          GOMOD_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "go.mod Wails version:    ${GOMOD_VERSION}"
          echo "Pinned CLI version (CI): ${WAILS_CLI_VERSION}"
          if [ "${GOMOD_VERSION}" != "${WAILS_CLI_VERSION}" ]; then
            echo "::error::Wails version mismatch: go.mod requires ${GOMOD_VERSION} but CI pins the CLI at ${WAILS_CLI_VERSION}."
            echo "::error::Fix: update WAILS_CLI_VERSION in .github/workflows/ci.yml AND .github/workflows/release.yml to ${GOMOD_VERSION}, or run 'go get github.com/wailsapp/wails/v2@${WAILS_CLI_VERSION}' so both sides agree. Also update CLAUDE.md §7 if the minor version changes."
            exit 1
          fi

      - name: wails build (Linux sanity check)
        run: wails build -platform linux/amd64 -tags webkit2_41

  # ---------------------------------------------------------------------------
  # The ADDITIONAL PLATFORM CHECK (docs/UITESTING.md): Windows, the real
  # WebView2 engine, and the packaged .exe. Opt-in: it needs the packaged .exe
  # and the real WebView2, so it runs on demand and on tags rather than on every
  # push. The Linux rendering assertions gate in ui.yml. It shares its probes
  # with the Linux harness (scripts/uitest/probes.js), so only the plumbing is
  # duplicated, not the assertions.
  #
  # STILL UNVERIFIED: this script has never been executed on a Windows machine,
  # which is why it is continue-on-error. Promote it to a gate by deleting that
  # line once it has passed a few times.
  ui-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_CLI_VERSION}

      - name: UI checks against wails dev
        run: pwsh scripts/uitest/Invoke-UITest.ps1 -KeepArtifacts

      - name: UI smoke test against the packaged binary
        run: pwsh scripts/uitest/Invoke-UITest.ps1 -Packaged -KeepArtifacts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-rendering-windows
          path: scripts/uitest/artifacts/
          if-no-files-found: ignore
