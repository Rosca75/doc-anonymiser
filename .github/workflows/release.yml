# release.yml — build and publish release zips when a version tag is pushed.
#
# Trigger: pushing a tag like v1.2.3.
# Outputs (attached to a GitHub Release for that tag):
#   - doc-anonymiser-vX.Y.Z-windows.zip   (primary target)
#   - doc-anonymiser-vX.Y.Z-linux.zip     (secondary target)
#   - doc-anonymiser-vX.Y.Z-macos.zip     (best-effort, may fail without
#                                          failing the release)
# Each zip contains the executable plus a README-FIRST.txt generated below
# (how to run, the optional Ollama note, and the Windows SmartScreen note).
name: Release

on:
  push:
    tags:
      - "v*"

env:
  # Must match go.mod and ci.yml — see CLAUDE.md §7 (coupled pair).
  WAILS_CLI_VERSION: v2.13.0

permissions:
  # Least privilege at the top level: the build jobs only read the repository.
  # The publish job below overrides this with the write access it needs to
  # create the Release and upload assets.
  contents: read

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_CLI_VERSION

      - name: Verify Wails CLI version matches go.mod
        shell: bash
        run: |
          GOMOD_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          if [ "${GOMOD_VERSION}" != "${WAILS_CLI_VERSION}" ]; then
            echo "::error::Wails version mismatch: go.mod requires ${GOMOD_VERSION} but this workflow pins ${WAILS_CLI_VERSION}. Update WAILS_CLI_VERSION here and in ci.yml, or align go.mod."
            exit 1
          fi

      - name: Build Windows executable
        run: wails build -platform windows/amd64

      - name: Assemble zip (exe + README-FIRST.txt)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"                      # e.g. v1.2.3
          STAGE="doc-anonymiser-${TAG}-windows"
          mkdir -p "${STAGE}"
          cp build/bin/doc-anonymiser.exe "${STAGE}/"
          cat > "${STAGE}/README-FIRST.txt" <<'EOF'
          doc-anonymiser — read me first
          ==============================

          HOW TO RUN
          ----------
          1. Unzip this folder anywhere (e.g. your Desktop).
          2. Double-click doc-anonymiser.exe.

          WINDOWS SMARTSCREEN
          -------------------
          The first time you run the app, Windows SmartScreen may show
          "Windows protected your PC" because the binary is not signed by a
          registered publisher. Click "More info", then "Run anyway".
          The app is built publicly on GitHub Actions from open source:
          https://github.com/Rosca75/doc-anonymiser

          OPTIONAL: LOCAL AI (OLLAMA)
          ---------------------------
          The app works fully offline with no AI installed. If you want the
          optional AI-assisted entity discovery and deep-scan features:
            1. Install Ollama from https://ollama.com/download
            2. In a terminal, run:  ollama pull qwen2.5:3b-instruct
            3. Start the app — the AI features light up automatically.
          The app only ever talks to Ollama on your own machine
          (127.0.0.1:11434). No document data leaves your computer.
          EOF
          7z a "${STAGE}.zip" "${STAGE}"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: doc-anonymiser-*-windows.zip

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      - name: Verify Wails CLI version matches go.mod
        run: |
          GOMOD_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          if [ "${GOMOD_VERSION}" != "${WAILS_CLI_VERSION}" ]; then
            echo "::error::Wails version mismatch: go.mod requires ${GOMOD_VERSION} but this workflow pins ${WAILS_CLI_VERSION}. Update WAILS_CLI_VERSION here and in ci.yml, or align go.mod."
            exit 1
          fi

      - name: Build Linux executable
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Assemble zip (binary + README-FIRST.txt)
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="doc-anonymiser-${TAG}-linux"
          mkdir -p "${STAGE}"
          cp build/bin/doc-anonymiser "${STAGE}/"
          cat > "${STAGE}/README-FIRST.txt" <<'EOF'
          doc-anonymiser — read me first
          ==============================

          HOW TO RUN
          ----------
          1. Unzip this folder anywhere.
          2. Make the binary executable if needed:  chmod +x doc-anonymiser
          3. Run it:  ./doc-anonymiser
          Requires GTK3 and WebKit2GTK 4.1 (preinstalled on most modern
          desktop distributions).

          OPTIONAL: LOCAL AI (OLLAMA)
          ---------------------------
          The app works fully offline with no AI installed. If you want the
          optional AI-assisted entity discovery and deep-scan features:
            1. Install Ollama from https://ollama.com/download
            2. In a terminal, run:  ollama pull qwen2.5:3b-instruct
            3. Start the app — the AI features light up automatically.
          The app only ever talks to Ollama on your own machine
          (127.0.0.1:11434). No document data leaves your computer.
          EOF
          zip -r "${STAGE}.zip" "${STAGE}"

      - name: Upload Linux zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: doc-anonymiser-*-linux.zip

  # ---------------------------------------------------------- macOS (bonus)
  # Best-effort only: a failure here must never block the release.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26.x
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      - name: Build macOS app
        run: wails build -platform darwin/universal

      - name: Assemble zip (.app + README-FIRST.txt)
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="doc-anonymiser-${TAG}-macos"
          mkdir -p "${STAGE}"
          cp -R build/bin/doc-anonymiser.app "${STAGE}/"
          cat > "${STAGE}/README-FIRST.txt" <<'EOF'
          doc-anonymiser — read me first (macOS, best-effort build)
          =========================================================

          HOW TO RUN
          ----------
          1. Unzip this folder anywhere.
          2. Right-click doc-anonymiser.app → Open (needed once, because the
             app is not notarised).

          OPTIONAL: LOCAL AI (OLLAMA)
          ---------------------------
          Install Ollama from https://ollama.com/download and run:
            ollama pull qwen2.5:3b-instruct
          The app only ever talks to Ollama on your own machine
          (127.0.0.1:11434). No document data leaves your computer.
          EOF
          zip -r "${STAGE}.zip" "${STAGE}"

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: doc-anonymiser-*-macos.zip

  # --------------------------------------------------------------- Release
  # Collects the zips and attaches them to a GitHub Release for the tag.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes: it creates the GitHub Release and uploads the
      # zip assets. The other jobs inherit the read-only top-level default.
      contents: write
    steps:
      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach zips
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
