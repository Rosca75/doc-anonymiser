<!DOCTYPE html>
<!--
  index.html — the single page of the doc-anonymiser frontend.

  Frontend discipline (CLAUDE.md §4):
    - No framework, no build step, no external fonts or CDNs — everything
      referenced here is a local file embedded in the binary via go:embed.
    - api.js is the ONLY module that calls Go bound methods.
    - state.js is the ONLY holder of frontend state.
    - views/* render from state and dispatch actions.

  The wizard shell (main.js) renders the step header, the active view and
  the navigation footer into #app.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doc-anonymiser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The wizard shell renders itself into this container. The CSS drop
       property below marks it as a Wails drag-and-drop target. -->
  <div id="app" style="--wails-drop-target: drop"></div>

  <!-- ES module entry point: boots the wizard shell. -->
  <script type="module">
    import { boot } from "./main.js";
    boot(document.getElementById("app"));
  </script>
</body>
</html>
